name: FleetFlow_test

on:
  push:
    branches: main
  pull_request:
    branches:  main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: healthcare
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."
          for i in {1..10}; do
            nc -z localhost 3306 && echo "MySQL is up!" && exit 0
            sleep 5
          done
          echo "MySQL did not start" && exit 1

      - name: Compile and Test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/healthcare
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 1234
        run: mvn clean verify

      - name: Save JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-executable
          path: target/*.jar