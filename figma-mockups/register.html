<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register · HealthCare+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{brand:{600:'#2563eb'},cyan:{500:'#06B6D4'},slatebg:'#F8FAFC'}}}}</script>
  </head>
  <body class="min-h-screen bg-slatebg text-slate-900 antialiased">
    <div class="grid min-h-screen lg:grid-cols-2">
      <section class="hidden lg:flex items-center justify-center bg-[linear-gradient(135deg,#eff6ff,#ecfeff)] p-12">
        <div class="max-w-xl rounded-[2rem] bg-white p-10 shadow-[0_20px_60px_rgba(15,23,42,0.08)] border border-slate-100">
          <div class="inline-flex rounded-full bg-brand-50 px-4 py-2 text-sm text-brand-700">Create an account</div>
          <h1 class="mt-6 text-4xl font-semibold tracking-tight">Built for hospitals, clinics, and modern care teams.</h1>
          <p class="mt-4 text-slate-500">A clean, premium interface for managing the clinic with confidence and speed.</p>
          <div class="mt-8 grid grid-cols-2 gap-4">
            <div class="rounded-3xl bg-slate-50 p-5"><div class="text-sm text-slate-500">Secure access</div><div class="mt-1 text-2xl font-semibold">JWT</div></div>
            <div class="rounded-3xl bg-slate-50 p-5"><div class="text-sm text-slate-500">Responsive</div><div class="mt-1 text-2xl font-semibold">100%</div></div>
          </div>
        </div>
      </section>
      <section class="flex items-center justify-center p-6 sm:p-10 lg:p-14">
        <div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-[0_20px_60px_rgba(15,23,42,0.08)]">
          <div class="h-12 w-12 rounded-2xl bg-cyan-500 text-white flex items-center justify-center font-semibold">H</div>
          <h2 class="mt-6 text-3xl font-semibold tracking-tight">Create your account</h2>
          <p class="mt-2 text-sm text-slate-500">Join the HealthCare+ platform to manage operations.</p>
          <form class="mt-8 space-y-4">
            <input class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-cyan-500 focus:ring-4 focus:ring-cyan-100" placeholder="Full name" />
            <input class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-cyan-500 focus:ring-4 focus:ring-cyan-100" placeholder="Email" />
            <input class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-cyan-500 focus:ring-4 focus:ring-cyan-100" placeholder="Role: Admin / Doctor / Patient / Receptionist" />
            <input type="password" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-cyan-500 focus:ring-4 focus:ring-cyan-100" placeholder="Password" />
            <button class="w-full rounded-2xl bg-brand-600 px-4 py-3.5 font-medium text-white transition hover:bg-brand-700">Create account</button>
            <div class="text-center text-sm text-slate-500">Already have an account? <a href="login.html" class="font-medium text-brand-700">Sign in</a></div>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
